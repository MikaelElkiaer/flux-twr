---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-upgrade-ksm
  namespace: system-upgrade
  labels:
    app.kubernetes.io/name: system-upgrade-ksm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: system-upgrade-ksm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: system-upgrade-ksm
    spec:
      serviceAccountName: system-upgrade-ksm
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          args:
            - --custom-resource-state-only=true
            - --custom-resource-state-config-file=/etc/customresourcestate/config.yaml
            - --namespaces=system-upgrade
            - --port=8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/customresourcestate
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: system-upgrade-ksm-config
