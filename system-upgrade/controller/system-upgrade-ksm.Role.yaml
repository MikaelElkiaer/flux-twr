---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: system-upgrade-ksm
  namespace: system-upgrade
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: system-upgrade-ksm
  namespace: system-upgrade
rules:
  - apiGroups:
      - upgrade.cattle.io
    resources:
      - plans
    verbs:
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system-upgrade-ksm
  namespace: system-upgrade
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: system-upgrade-ksm
subjects:
  - kind: ServiceAccount
    name: system-upgrade-ksm
    namespace: system-upgrade
