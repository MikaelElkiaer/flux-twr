---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
    command: ["/bin/sh", "-xe", "-c"]
    args:
      - |
        NEW_BINARY="/opt/k3s"

        # 1. Locate running K3s PID in the container/RootlessKit PID namespace
        K3S_PID=$(ps -ef | grep -E "( |/)k3s .*(server|agent)" | grep -E -v "(init|grep|channelserver|supervise-daemon|apply|upgrade|sh)" | awk '{print $2}' | head -n 1)
        if [ -z "$K3S_PID" ]; then
          echo "Error: K3s server PID not found" >&2
          exit 1
        fi
        echo "Found K3s PID: $K3S_PID"

        # 2. Extract host binary path
        K3S_BIN_PATH=$(tr '\0' '\n' < "/proc/${K3S_PID}/cmdline" | head -n 1)
        FULL_BIN_PATH=""
        if [ -n "$K3S_BIN_PATH" ] && [ -f "/host${K3S_BIN_PATH}" ]; then
          FULL_BIN_PATH="/host${K3S_BIN_PATH}"
        else
          for candidate in /host/home/*/.local/bin/k3s /host/usr/local/bin/k3s /host/usr/bin/k3s; do
            if [ -f "$candidate" ]; then
              FULL_BIN_PATH="$candidate"
              break
            fi
          done
        fi
        if [ -z "$FULL_BIN_PATH" ] || [ ! -f "$FULL_BIN_PATH" ]; then
          echo "Error: Could not locate k3s binary on host" >&2
          exit 1
        fi
        echo "Target host binary path: $FULL_BIN_PATH"

        # 3. Check if binary is already upgraded (handles retry after service restart)
        BIN_CHECKSUMS="$(sha256sum "$NEW_BINARY" "$FULL_BIN_PATH")"
        BIN_COUNT="$(echo "${BIN_CHECKSUMS}" | awk '{print $1}' | uniq | wc -l)"
        if [ "$BIN_COUNT" = "1" ]; then
          echo "Binary already replaced with target version. Exiting successfully."
          exit 0
        fi

        # 4. Atomically replace host binary
        cp -f "$NEW_BINARY" "${FULL_BIN_PATH}.tmp"
        chmod a+x "${FULL_BIN_PATH}.tmp"
        mv -f "${FULL_BIN_PATH}.tmp" "$FULL_BIN_PATH"
        echo "Binary replaced successfully."

        # 5. Signal K3s to stop; systemd --user will restart it with the new binary
        kill -SIGTERM "$K3S_PID"
        echo "Sent SIGTERM to K3s PID $K3S_PID."
  version: v1.37.1+k3s1
