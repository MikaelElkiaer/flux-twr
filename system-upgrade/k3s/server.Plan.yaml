---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  upgrade:
    command: ["/bin/sh", "-c"]
    args:
      - "rm -f /host/home/me/.local/bin/k3s && cp /opt/k3s /host/home/me/.local/bin/k3s && rm -rf /host/home/me/.rancher/k3s/data && kill -9 1"
    envs:
      - name: SYSTEM_UPGRADE_K3S_STATE_DIR
        value: /home/me/.rancher/k3s
    image: rancher/k3s-upgrade@sha256:2444dd12ac03486408b99d059ed04383b78f4b536f1cba8d55a7e753aac4f962
  version: v1.36.3+k3s1
