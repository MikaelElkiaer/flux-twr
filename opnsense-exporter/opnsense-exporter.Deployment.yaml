---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: opnsense-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opnsense-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opnsense-exporter
    spec:
      containers:
        - name: opnsense-exporter
          image: ghcr.io/athennamind/opnsense-exporter:0.0.20@sha256:4e2b8ba8be111455090664e161c5dc68ab7706e3eb4dcfae40609e5fc33e959c
          imagePullPolicy: Always
          volumeMounts:
            - name: api-key
              mountPath: /etc/opnsense-exporter/creds
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          ports:
            - name: metrics-http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: metrics-http
          readinessProbe:
            httpGet:
              path: /
              port: metrics-http
          args:
            - --log.level=info
            - --log.format=json
            - --exporter.disable-wireguard
            - --exporter.disable-openvpn
          env:
            - name: OPNSENSE_EXPORTER_INSTANCE_LABEL
              value: opnsense
            - name: OPNSENSE_EXPORTER_OPS_API
              value: opnsense.internal
            - name: OPNSENSE_EXPORTER_OPS_PROTOCOL
              value: https
            - name: OPS_API_KEY_FILE
              value: /etc/opnsense-exporter/creds/api-key
            - name: OPS_API_SECRET_FILE
              value: /etc/opnsense-exporter/creds/api-secret
            - name: OPNSENSE_EXPORTER_OPS_INSECURE
              value: "true"
          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 500m
      volumes:
        - name: api-key
          secret:
            secretName: opnsense-apikey
            items:
              - key: key
                path: api-key
              - key: secret
                path: api-secret
