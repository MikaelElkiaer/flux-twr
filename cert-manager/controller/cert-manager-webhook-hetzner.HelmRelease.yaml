apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-hetzner
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager-webhook-hetzner
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-hetzner
        namespace: cert-manager
  dependsOn:
    - name: cert-manager
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: monitoring.coreos.com/v1
              kind: ServiceMonitor
              name: cert-manager-webhook-hetzner
            patch: |
              - op: replace
                path: /metadata/labels/release
                value: prom-stack
  upgrade:
    crds: CreateReplace
  values:
    groupName: elkiaer.net
    metrics:
      serviceMonitor:
        enabled: true
