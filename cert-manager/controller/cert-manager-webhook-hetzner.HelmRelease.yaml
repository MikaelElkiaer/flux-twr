apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-hetzner
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager-webhook-hetzner
      version: 0.9.0
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-hetzner
        namespace: cert-manager
  dependsOn:
    - name: cert-manager
  upgrade:
    crds: CreateReplace
  values:
    groupName: elkiaer.net
    metrics:
      serviceMonitor:
        enabled: true
