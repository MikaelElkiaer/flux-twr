apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: ""
  bookmarks.yaml: ""
  services.yaml: |
    - System:
      - OPNSense:
          icon: opnsense.png
          href: https://opnsense.internal
          description: Router
  widgets.yaml: |
    - resources:
        backend: resources
        cpu: true
        disk:
          - /
          - /mnt/data
        expanded: true
        memory: true
        uptime: true
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
  proxmox.yaml: ""
