---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-gotify-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-gotify-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-gotify-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-gotify-bridge
    spec:
      containers:
        - name: bridge
          image: druggeri/alertmanager_gotify_bridge:latest@sha256:242441023c6a7956fc7bcdd30350a8fed38f791e703d670aa286fc0465f88b41
          env:
            - name: GOTIFY_ENDPOINT
              value: "http://gotify.gotify.svc.cluster.local:8080/message"
            - name: GOTIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gotify-alertmanager-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 5m
              memory: 16Mi
