---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify-alertmanager-token
  namespace: monitoring
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  data:
    - secretKey: token
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # Placeholder for Gotify App Token in Bitwarden
