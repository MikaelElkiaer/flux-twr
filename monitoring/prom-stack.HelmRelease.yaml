apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prom-stack
spec:
  interval: 10m0s
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: flux-kube-state-metrics-config
      valuesKey: kube-state-metrics-config.yaml
  values:
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['alertname', 'namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: 'gotify'
          routes:
            - matchers:
                - alertname = "Watchdog"
              receiver: "null"
        receivers:
          - name: "null"
          - name: "gotify"
            webhook_configs:
              - url: "http://alertmanager-gotify-bridge.monitoring.svc.cluster.local:8080/gotify_webhook"
                send_resolved: true
    grafana:
      grafana.ini:
        auth.anonymous:
          enabled: true
          org_role: Editor
      ingress:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Dashboards and alerts
          gethomepage.dev/group: System
          gethomepage.dev/icon: grafana.png
          gethomepage.dev/name: Grafana
          gethomepage.dev/pod-selector: app.kubernetes.io/name=grafana
        enabled: true
        hosts:
          - grafana.home.elkiaer.net
      sidecar:
        dashboards:
          labelValue: "1"
          searchNamespace: "ALL"
    # INFO: Not running as pods in k3s
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
